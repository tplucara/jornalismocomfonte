# Ambiente local do Jornalismo com Fonte.
# Isolado de outros projetos Docker da máquina (ver .cursor/rules/ambiente-local.mdc):
# nome de projeto, containers, volumes e rede prefixados com jcf; portas altas no host.
name: jcf

services:
  db:
    image: postgres:16
    container_name: jcf-db
    environment:
      POSTGRES_DB: jcf
      POSTGRES_USER: jcf
      POSTGRES_PASSWORD: jcf_dev_only
    ports:
      - "5433:5432"
    volumes:
      - jcf_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
      - ./db/tests:/tests:ro
      - ./db/seeds:/seeds:ro
      - ./db/dev:/devsql:ro
    networks:
      - jcf_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jcf -d jcf"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16
    container_name: jcf-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: jcf_dev_only
      PGHOST: jcf-db
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/tests:/tests:ro
      - ./db/seeds:/seeds:ro
      - ./db/dev:/devsql:ro
      - ./db/scripts/migrate.sh:/migrate.sh:ro
    networks:
      - jcf_net
    command: ["sh", "/migrate.sh"]
    restart: "no"

  # Volume de mídia nasce root; distroless corre como nonroot (65532).
  media-init:
    image: busybox:1.37
    container_name: jcf-media-init
    volumes:
      - jcf_media:/data/media
    networks:
      - jcf_net
    command: ["sh", "-c", "mkdir -p /data/media/avatars /data/media/proofs && chown -R 65532:65532 /data/media"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: jcf-web:local
    container_name: jcf-web
    depends_on:
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
    environment:
      ENV: dev
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://jcf_web:jcf_web_dev_only@jcf-db:5432/jcf?sslmode=disable
      IP_HASH_SALT: dev-rotate-me
      MEDIA_DIR: /data/media
    volumes:
      - jcf_media:/data/media
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - jcf_net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/web", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: jcf-worker:local
    container_name: jcf-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENV: dev
      DATABASE_URL: postgres://jcf_worker:jcf_worker_dev_only@jcf-db:5432/jcf?sslmode=disable
      IP_HASH_SALT: dev-rotate-me
    networks:
      - jcf_net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    container_name: jcf-caddy
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8843:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - jcf_net
    security_opt:
      - no-new-privileges:true

volumes:
  jcf_pgdata:
    name: jcf_pgdata
  jcf_media:
    name: jcf_media

networks:
  jcf_net:
    name: jcf_net
